name: CI

on:
  push:
    branches: [master, "phase-*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT5_PACKAGES: qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev
  QT6_PACKAGES: >-
    qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
    libqt6svg6-dev qt6-5compat-dev libgl-dev
  APT_PACKAGES: >-
    ninja-build libboost-program-options-dev libboost-thread-dev libboost-chrono-dev
    libboost-system-dev libboost-date-time-dev libboost-atomic-dev
    libexiv2-dev libtiff-dev libpng-dev libopenexr-dev libgsl-dev libjpeg-dev
    libcfitsio-dev libraw-dev libfftw3-dev liblcms2-dev libeigen3-dev
    libgtest-dev libavif-dev libjxl-dev libwebp-dev

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: ""
            qt: QT5_PACKAGES
          - name: gcc qt6
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: ""
            qt: QT6_PACKAGES
          - name: clang asan+ubsan
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitize: "address;undefined"
            qt: QT5_PACKAGES
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.name }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ matrix.name }}-
      - name: Install dependencies
        # the Azure Ubuntu mirror sometimes trickles at a few kB/s: cache
        # the packages between runs, and if the download is that slow,
        # switch to the main Ubuntu mirror and carry on from what arrived
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\"; Acquire::Retries \"5\"; Acquire::http::Timeout \"30\";" | sudo tee /etc/apt/apt.conf.d/80-ci
          sudo apt-get update
          # python3-pil is for the golden-image check
          pkgs="$APT_PACKAGES ${{ env[matrix.qt] }} clang libomp-dev python3-pil"
          if ! sudo timeout 480 apt-get install -y --no-install-recommends $pkgs; then
            echo "::warning::slow package mirror, switching to archive.ubuntu.com"
            sudo dpkg --configure -a || true
            # apt moves on to the next mirror in the list if one fails
            printf '%s\n' http://archive.ubuntu.com/ubuntu/ http://azure.archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          sudo chown -R "$USER" ~/apt-cache
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DENABLE_UNIT_TEST=ON
          -DLHDR_SANITIZE="${{ matrix.sanitize }}"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel -- -k 0 2>&1 | tee build.log
      - name: Summarize build errors
        if: failure()
        run: |
          {
            echo "### Build errors (${{ matrix.name }})"
            echo '```'
            grep -E "error:|undefined reference|FAILED:" build.log | sed 's#.*/LumiereHDR/LumiereHDR/##' | sort -u | head -300
            echo '```'
            echo "#### First failed command"
            echo '```'
            grep -m1 -A1 "^FAILED:" build.log | tail -1 | cut -c1-4000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Golden-image check of all tone mappers
        if: matrix.name == 'gcc release' || matrix.name == 'gcc qt6'
        run: |
          python3 test/golden/run_golden.py build/lumierehdr-cli

  fuzz:
    name: Fuzz Radiance reader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache downloaded packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-fuzz-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-fuzz-
      - name: Install dependencies
        # the Azure Ubuntu mirror sometimes trickles at a few kB/s: cache
        # the packages between runs, and if the download is that slow,
        # switch to the main Ubuntu mirror and carry on from what arrived
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\"; Acquire::Retries \"5\"; Acquire::http::Timeout \"30\";" | sudo tee /etc/apt/apt.conf.d/80-ci
          sudo apt-get update
          pkgs="$APT_PACKAGES $QT5_PACKAGES clang libomp-dev"
          if ! sudo timeout 480 apt-get install -y --no-install-recommends $pkgs; then
            echo "::warning::slow package mirror, switching to archive.ubuntu.com"
            sudo dpkg --configure -a || true
            # apt moves on to the next mirror in the list if one fails
            printf '%s\n' http://archive.ubuntu.com/ubuntu/ http://azure.archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          sudo chown -R "$USER" ~/apt-cache
      - name: Build fuzzer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLHDR_BUILD_FUZZERS=ON
          cmake --build build --target fuzz_rgbe
      - name: Seed corpus
        run: |
          mkdir -p corpus
          printf '#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y 1 +X 8\n\x02\x02\x00\x08\x88\x64\x88\x64\x88\x64\x88\x80' > corpus/rle.hdr
          printf '#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y 1 +X 2\n\x64\x64\x64\x80\x64\x64\x64\x80' > corpus/flat.hdr
      - name: Run for 2 minutes
        run: ./build/test/fuzz/fuzz_rgbe corpus -max_total_time=120 -max_len=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash
          path: crash-*

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p
            qt6-base:p qt6-tools:p qt6-svg:p qt6-5compat:p qt6-translations:p
            boost:p exiv2:p libtiff:p libpng:p openexr:p gsl:p libjpeg-turbo:p
            cfitsio:p libraw:p fftw:p lcms2:p eigen3:p gtest:p
            libavif:p libjxl:p libwebp:p
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DENABLE_UNIT_TEST=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel -- -k 0 2>&1 | tee build.log
      - name: Summarize build errors
        if: failure()
        run: |
          {
            echo "### Build errors (Windows)"
            echo '```'
            grep -E "error:|undefined reference|FAILED:" build.log | sed 's#.*/LumiereHDR/LumiereHDR/##' | sort -u | head -300
            echo '```'
            echo "#### First failed command"
            echo '```'
            grep -m1 -A1 "^FAILED:" build.log | tail -1 | cut -c1-4000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Check exploit mitigations
        shell: pwsh
        run: python build_files/check_pe_hardening.py build/lumierehdr.exe build/lumierehdr-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lumiere-windows-build
          path: |
            build/*.exe
